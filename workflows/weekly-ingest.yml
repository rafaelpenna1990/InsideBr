name: Atualização semanal do InsideBR

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (06:00 no horário de Brasília)
    - cron: "0 9 * * 1"
  workflow_dispatch: # permite disparar manualmente pela aba "Actions" do GitHub também

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar atualização no backend
        run: |
          curl -X POST "https://insidebr.onrender.com/api/internal/ingest-all" \
            -H "x-ingest-key: ${{ secrets.INGEST_SECRET }}" \
            --fail --silent --show-error
